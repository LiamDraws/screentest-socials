name: Screentest Social Posts

# Posts once a day: a 2-image post (spoiler-free cover card, then the
# combined answers card) covering ALL of yesterday's puzzles at once,
# including the locked/paywalled one. Time is UTC (cron is always UTC);
# 21:00 UTC = 07:00 Australia/Brisbane (fixed UTC+10, no DST — adjust if
# the site actually runs on a DST-observing zone like Sydney).
on:
  schedule:
    - cron: "0 21 * * *" # 07:00 AEST
  workflow_dispatch: {} # manual trigger from the Actions tab, no inputs needed

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed so the bot can commit each day's PNG cards for Threads to hotlink
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Post to socials
        run: npm run post
        env:
          SCREENTEST_SITE_URL: ${{ vars.SCREENTEST_SITE_URL }}
          CARD_SIZE: ${{ vars.CARD_SIZE }}
          BLUESKY_ENABLED: ${{ vars.BLUESKY_ENABLED }}
          X_ENABLED: ${{ vars.X_ENABLED }}
          THREADS_ENABLED: ${{ vars.THREADS_ENABLED }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          X_APP_KEY: ${{ secrets.X_APP_KEY }}
          X_APP_SECRET: ${{ secrets.X_APP_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
